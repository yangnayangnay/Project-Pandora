server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: h2
  application:
    name: pandora-backend
  datasource:
    url: jdbc:h2:file:D:/AndroidStudio/Project_Pandora/pandora-data/pandora-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2_schema.sql

jwt:
  secret: pandora-secret-key-2026-please-change-in-production-environment
  expiration: 86400000
  refresh-expiration: 604800000

deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${DEEPSEEK_API_KEY:dummy-key}
  timeout-mbti: 30000
  timeout-keyword: 10000

logging:
  level:
    com.pandora: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
