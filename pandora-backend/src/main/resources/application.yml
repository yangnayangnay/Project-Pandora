server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: h2
  application:
    name: pandora-backend
  datasource:
    url: jdbc:h2:file:./pandora-data/pandora-db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2_schema.sql
      data-locations: classpath:db/h2_data.sql
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

jwt:
  secret: pandora-secret-key-2026-please-change-in-production-environment
  expiration: 86400000
  refresh-expiration: 604800000

deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${DEEPSEEK_API_KEY:dummy-key}
  timeout-mbti: 30000
  timeout-keyword: 10000

pandora:
  # R41 REQ-41-A: API 密钥三态（off/log/enforce；云端经 pandora.env 注入值）
  api-key:
    mode: ${PANDORA_API_KEY_MODE:off}
    value: ${PANDORA_API_KEY:}
  admin-email: ${ADMIN_EMAIL:admin@pandora.local}
  permission:
    fallback-enabled: true
    auto-init: true

  top10:
    cleanup-dirty-data: true
    # Round19 REQ-19-07: 加权排序权重配置（可调）
    urgency-weight: 0.6
    time-weight: 0.4
  ai:
    quota-threshold: 100
    monitor-interval-ms: 300000
    external:
      timeout-ms: 30000
    fallback:
      url: http://localhost:8081

logging:
  level:
    com.pandora: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hierarchy:
  max-depth: 10
  cycle-detect: true

mbti:
  ai:
    timeout-ms: 30000
