server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pandora-backend
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: pandora
    password: pandora123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/oracle_schema.sql

jwt:
  secret: pandora-secret-key-2026-please-change-in-production-environment
  expiration: 86400000
  refresh-expiration: 604800000

deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${DEEPSEEK_API_KEY:dummy-key}
  timeout-mbti: 30000
  timeout-keyword: 10000

logging:
  level:
    com.pandora: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics